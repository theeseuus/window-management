[tools]
lua = "5.4.8"
node = "24.22.1"

[tasks.validate]
description = "Compile Lua sources and run pure logic tests"
run = "./scripts/validate.sh"

[tasks.native-spaces-build]
description = "Build the standalone native Space proof with the installed Apple SDK"
run = "./native/space-helper/build.sh"

[tasks.native-spaces-test]
description = "Check native helper CLI guards without creating windows"
depends = ["native-spaces-build"]
run = [
  "node native/space-helper/verify.cjs native/space-helper/.build/space-helper",
  "node native/space-helper/verify-bridge.cjs native/space-helper/.build/BridgeProbe.app/Contents/MacOS/bridge-probe native/space-helper/.build/WindowProbe.app/Contents/MacOS/window-probe",
]

[tasks.native-spaces-check-live]
description = "Read-only live Space schema checks; requires the logged-in GUI session"
depends = ["native-spaces-build"]
run = [
  "node native/space-helper/verify.cjs native/space-helper/.build/space-helper --live",
  "node native/space-helper/check-app-query.cjs native/space-helper/.build/BridgeProbe.app",
]
